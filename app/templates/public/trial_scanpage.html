{% extends "base.html" %}
{% block title %}Home - CyberCheck{% endblock %}

{% block content %}

<style>
    /* Custom Animations */
    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    .hero-banner h1 {
        font-size: 3rem;
        animation: fadeInDown 1.5s;
    }

    .hero-banner p {
        font-size: 1.2rem;
        color: #e0e0e0;
        animation: fadeIn 2s;
    }

    .steps-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 20px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        color: #e0e0e0;
    }

    .steps-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.3);
    }

    .steps-card h4 {
        color: #ffffff;
    }

    .step-icon {
        font-size: 3rem;
        color: #5968ff;
        margin-bottom: 15px;
    }

    body {
        background: linear-gradient(135deg, #0a0f1e, #1a1f38);
        color: #ffffff;
        font-family: 'Poppins', sans-serif;
    }

    h1,
    h2,
    h3,
    h4 {
        font-family: 'Merriweather', serif;
        font-weight: bold;
    }

    .steps-section {
        padding: 50px 0;
    }

    .steps-card {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        color: #e0e0e0;
        position: relative;
        overflow: hidden;
        height: 150px;
        /* Initial height for hover animation */
    }

    .steps-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.3);
        height: auto;
        /* Expands to fit description */
    }

    .step-icon {
        font-size: 3rem;
        color: #5968ff;
        margin-bottom: 10px;
    }

    .steps-card h4 {
        color: #ffffff;
        margin-bottom: 10px;
    }

    .step-description {
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        font-size: 0.9rem;
        color: #e0e0e0;
        margin-top: 10px;
        display: none;
        /* Initially hidden */
    }

    .steps-card:hover .step-description {
        opacity: 1;
        transform: translateY(0);
        display: block;
        /* Shows description on hover */
    }
</style>
<div class="body-section">
    <!-- Hero Section -->
    <div class="hero-banner text-center py-5 mt-5">
        <h1>Welcome</h1>
        <p>Scan for free!!!</p>
    </div>

    <form id="scanForm" method="POST" action="/trial_scan">
        <!-- URL Input -->
        <div class="mb-3">
            <label for="url" class="form-label">Website URL</label>
            <input type="url" class="form-control" id="url" name="url" placeholder="https://example.com" required>
        </div>

        <!-- Vulnerability Selection -->
        <div class="mb-3">
            <label for="vulnerability" class="form-label">Choose Vulnerability</label>
            <select class="form-select" id="vulnerability" name="vulnerability">
                <option value="" selected>Select an option</option>
                <option value="sql_injection">SQL Injection</option>
                <option value="xss">Cross-Site Scripting (XSS)</option>
                <option value="csrf">Cross-Site Request Forgery (CSRF)</option>
                <option value="security_headers">Security Headers</option>
                <option value="insecure_deserialization">Insecure Deserialization</option>
                <option value="sensitive_data">Sensitive Data Exposure</option>
                <option value="broken_authentication">Broken Authentication</option>
                <option value="known_vulnerabilities">Known Vulnerabilities in Components</option>
                <option value="insufficient_logging">Insufficient Logging and Monitoring</option>
            </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100">Scan</button>
    </form>

    <!-- Progress Section -->
    <div id="progressSection" class="mt-4" style="display: none;">
        <h4>Scan Progress</h4>
        <div class="progress mb-3">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                style="width: 0%;" aria-valuemin="0" aria-valuemax="100">
                0%
            </div>
        </div>
        <p id="remainingTime" class="text-muted">Estimating remaining time...</p>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="mt-5" style="display: none;">
        <h3>Scan Results</h3>
        <pre id="output" class="bg-dark p-3 border rounded" style="max-height: 400px; overflow-y: auto;"></pre>
    </div>
</div>

<script>
    const form = document.getElementById('scanForm');
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const remainingTime = document.getElementById('remainingTime');
    const resultsSection = document.getElementById('resultsSection');
    const output = document.getElementById('output');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        // Reset results and progress before starting a new scan
        resultsSection.style.display = "none";
        progressSection.style.display = "block";
        progressBar.style.width = "0%";
        progressBar.textContent = "0%";
        remainingTime.textContent = "Estimating remaining time...";
        output.textContent = ""; // Clear previous results

        const formData = new FormData(form);
        const payload = {
            url: formData.get('url'),
            vulnerability: formData.get('vulnerability') || null,
        };

        try {
            // Start scanning
            const response = await fetch('/scan', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
            });

            // Handle progress
            const reader = response.body.getReader();
            let receivedLength = 0;
            const decoder = new TextDecoder('utf-8');
            let progress = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                receivedLength += value.length;
                const chunk = decoder.decode(value, { stream: true });
                const data = JSON.parse(chunk);

                // Update progress
                progress += 10; // Assume each chunk represents 10% progress
                progressBar.style.width = `${progress}%`;
                progressBar.textContent = `${progress}%`;
                remainingTime.textContent = `${Math.max(0, (100 - progress) / 10)} seconds remaining`;

                // Append results dynamically
                output.textContent += JSON.stringify(data, null, 2) + '\n';
            }

            // Finalize results
            resultsSection.style.display = "block";
            remainingTime.textContent = "Scan completed!";
        } catch (error) {
            output.textContent = `Error: ${error.message}`;
            resultsSection.style.display = "block";
        } finally {
            progressBar.style.width = "100%";
            progressBar.textContent = "100%";
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>


{% endblock %}
