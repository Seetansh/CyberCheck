{% extends 'base.html' %}

{% block title %}CyberCheck: Home{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .banner {
        background-image: url('banner-image.jpg');
        /* Replace with your banner image */
        background-size: cover;
        background-position: center;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
    }

    .banner-content {
        background-color: rgba(0, 0, 0, 0.6);
        /* Semi-transparent background */
        padding: 20px;
        border-radius: 8px;
        text-align: center;
    }

    .banner-title {
        font-size: 2.5rem;
        margin-bottom: 10px;
    }

    .banner-subtitle {
        font-size: 1.2rem;
        margin-bottom: 20px;
    }

    .banner-button {
        display: inline-block;
        padding: 12px 24px;
        font-size: 1rem;
        color: #fff;
        background-color: #007BFF;
        text-decoration: none;
        border-radius: 5px;
        transition: all 0.3s ease-in-out;
    }

    .banner-button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
        /* Slight hover effect */
    }

    @media (max-width: 768px) {
        .banner {
            height: 200px;
        }

        .banner-title {
            font-size: 2rem;
        }

        .banner-subtitle {
            font-size: 1rem;
        }
    }
</style>

<div class="container my-5">
    <h1 class="text-center">Vulnerability Scanner</h1>
    <p class="text-center">Scan your website for potential vulnerabilities.</p>

    <section class="banner">
        <div class="banner-content">
            <h1 class="banner-title">Welcome to Our Service</h1>
            <p class="banner-subtitle">Scan your websites quickly and easily</p>
            <a href="/scanpage" class="banner-button">Scan</a>
        </div>
    </section>
</div>

<script>
    // Redirect to the scan page on button click
    document.addEventListener('click', function (event) {
        if (event.target.matches('.banner-button')) {
            event.preventDefault();
            window.location.href = event.target.href;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
