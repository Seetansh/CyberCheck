<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Scan History</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Website URL</th>
                    <th>Scan Date & Time</th>
                    <th>Result</th>
                    <th>Time Taken (seconds)</th>
                </tr>
            </thead>
            <tbody>
                {% if scan_history_data %}
                {% for scan in scan_history_data %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ scan.website_url }}</td>
                    <td>{{ scan.scan_date_time }}</td>
                    <td>{{ scan.result }}</td>
                    <td>{{ scan.time_taken }}</td>
                </tr>
                {% endfor %}
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No scan history found</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>

</html>
